<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AmbiBottom Companion – colour measurement</title>
<link rel="icon" href="data:,">
<!-- Measurement prototype (calibration plan step 1): measures, changes NOTHING for good.
     v0.4: a one-screen «measurement mode» (full-screen camera, one big button Lock -> Start -> Stop, the lock
     casts white + darkens by itself until nothing clips, the screen stays awake, phone motion is detected and the
     colour is measured again), ~3 min: C = 11 colours with the strip as now, B = the same with the strip dark
     (a brightness-0 PREVIEW, never saved), A = the strip's own R / G / B with the TV black (service stopped
     ~30 s, WLED solid colours, then everything put back). Output: a JSON file to fit the colour matrix offline.
     Nothing leaves the browser except requests to the user's ESP and TV; the PIN stays in memory only. -->
<style>
:root{--bg:#0f1416;--panel:#172024;--panel2:#1e2a2f;--line:#2b3a40;--text:#e6eef0;--muted:#8fa3a8;--acc:#4dbda7;--acc2:#70d8cc;--warn:#e0b040;--bad:#e06a5a;--ok:#5ccf8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:16px;margin:0;letter-spacing:.06em;flex:1 1 auto;min-width:0}header h1 em{color:var(--acc);font-style:normal}.lang{flex:none}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px}
.card h2{margin:0 0 4px;font-size:17px}.card p{margin:0 0 10px;color:var(--muted);font-size:14px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#06221d}.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=password]{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit}
.res{margin-top:10px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--muted)}
table{border-collapse:collapse;font-size:13px;margin-top:8px;width:100%}td,th{padding:3px 6px;border-top:1px solid var(--line);text-align:left}th{color:var(--muted);font-weight:500}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid rgba(255,255,255,.2)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.lang button{border:0;background:none;color:var(--muted);padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}.lang button.on{background:var(--acc);color:#06221d}
google-cast-launcher{display:inline-block;width:40px;height:40px;cursor:pointer;--connected-color:var(--acc2);--disconnected-color:var(--text)}
footer{color:var(--muted);font-size:12px;text-align:center;padding:8px 16px 24px}
/* v0.12: the white sliders */
.nb{min-width:34px;height:34px;padding:0;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--fg);font-size:18px;line-height:1}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;row-gap:2px !important;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:6px 0}
.trow span:first-child{grid-row:1;grid-column:1/3}.trow span:last-child{grid-row:1;grid-column:2/4;text-align:right}
.trow .nb:first-of-type{grid-row:2;grid-column:1}.trow input{grid-row:2;grid-column:2}.trow .nb:last-of-type{grid-row:2;grid-column:3}.trow input{width:100%;accent-color:var(--acc)}
ol{margin:6px 0 0;padding-left:20px;color:var(--muted);font-size:14px}
.big{width:100%;font-size:18px;padding:16px}
/* ---- measurement mode: one screen, nothing to scroll */
#mm{position:fixed;inset:0;z-index:10;background:#000;display:none;flex-direction:column}
#mm.on{display:flex}
#mmTop{padding:10px 14px calc(8px) 14px;padding-top:max(10px,env(safe-area-inset-top));background:rgba(15,20,22,.92);border-bottom:1px solid var(--line)}
#mmPhase{font-size:17px;font-weight:700;color:var(--acc2);min-height:1.3em}
#mmMsg{font-size:14px;color:var(--text);min-height:1.3em}
#mmVals{font-size:12px;color:var(--muted);margin-top:2px}
#mmBar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}#mmBar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2))}
#mmStage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
#mmWrap{position:relative;touch-action:none;line-height:0}
#mmWrap video{display:block;max-width:100vw;max-height:100%}
#mmWrap canvas{position:absolute;inset:0;width:100%;height:100%}
#mmBot{display:flex;gap:10px;align-items:center;margin-bottom:8px}
#mmGo{flex:1;font-size:19px;padding:16px}
#mmX{flex:none;width:52px;height:52px;padding:0;font-size:22px}
#mmCount{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:96px;font-weight:800;color:#fff;text-shadow:0 2px 12px #000;display:none;line-height:1}
#mmPlace{position:absolute;left:8px;right:8px;top:8px;padding:10px 12px;border-radius:10px;font-weight:700;line-height:1.3;display:none;font-size:15px}
#mmPlace.ok{background:rgba(92,207,138,.95);color:#052b14}#mmPlace.bad{background:rgba(224,106,90,.95);color:#2b0805}
#mmAlert{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(224,176,64,.95);color:#1b1400;font-weight:700;padding:10px 16px;border-radius:10px;display:none;line-height:1.3;text-align:center}
</style>
</head>
<body>
<header><h1>AMBI<em>BOTTOM</em> · <span data-t="title"></span> <span class="mut" id="pv" style="font-weight:400;font-size:12px"></span></h1>
  <div class="lang"><button id="lEn">EN</button><button id="lEl">ΕΛ</button></div></header>
<main>
  <div class="card"><p data-t="intro"></p><ol><li data-t="i1"></li><li data-t="i2"></li><li data-t="i3"></li></ol></div>

  <div class="card">
    <h2>1 · <span data-t="conT"></span></h2>
    <p data-t="conP"></p>
    <div class="row"><input type="text" id="addr" autocomplete="off" spellcheck="false" inputmode="url"></div>
    <div class="row" style="margin-top:8px"><input type="password" id="pin" autocomplete="off" inputmode="numeric"><button class="btn pri" id="conGo" data-t="conGo"></button></div>
    <div class="res" id="conRes"></div>
  </div>

  <div class="card">
    <h2>2 · <span data-t="castT"></span></h2>
    <p data-t="castP"></p>
    <div class="row"><google-cast-launcher id="castBtn" hidden></google-cast-launcher><span class="res" id="castRes" style="margin:0"></span></div>
  </div>

  <div class="card" id="eyeCard" style="display:none">
    <h2>✦ <span data-t="eyeT"></span></h2>
    <div id="eyeSlot"></div>
  </div>

  <div class="card">
    <h2>3 · <span data-t="camT"></span></h2>
    <p data-t="camP"></p>
    <div class="row" style="margin-bottom:10px"><select id="mode" class="btn" style="flex:1"><option value="quick" data-t="mQuick"></option><option value="full" data-t="mFull"></option></select></div>
    <button class="btn pri big" id="mmOpen" data-t="mmOpen"></button>
    <div class="res" id="openRes"></div>
  </div>

  <div class="card">
    <h2>4 · <span data-t="resT"></span></h2>
    <div class="res" id="runRes"></div>
    <div id="sum"></div>
    <div id="tryBox" style="display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:12px">
      <p class="mut" id="tryPtxt"></p>
      <div class="row"><button class="btn pri" id="tryOn"></button><button class="btn" id="tryOff" data-t="tryOff" disabled></button></div>
      <div class="row" style="margin-top:8px" id="tryPats"></div>
      <div class="row" style="margin-top:6px"><button class="btn" id="tryFade" data-t="tryFade"></button></div>
      <p class="mut" style="margin:10px 0 4px" id="trimPtxt"></p>
      <div class="trow"><span data-t="trWarm"></span><button class="nb" data-nudge="trX,-5">−</button><input type="range" id="trX" min="-200" max="200" step="1" value="0"><button class="nb" data-nudge="trX,5">+</button><span data-t="trCool"></span></div>
      <div class="trow"><span data-t="trGreen"></span><button class="nb" data-nudge="trY,-5">−</button><input type="range" id="trY" min="-200" max="200" step="1" value="0"><button class="nb" data-nudge="trY,5">+</button><span data-t="trMag"></span></div>
      <div class="trow"><span data-t="trDim"></span><button class="nb" data-nudge="trB,-5">−</button><input type="range" id="trB" min="30" max="250" step="1" value="100"><button class="nb" data-nudge="trB,5">+</button><span data-t="trBright"></span></div>
      <div class="row" style="margin-top:6px"><button class="btn" id="trZero"></button></div>
      <div class="res mut" id="trimVal"></div>
      <p class="mut" style="margin:12px 0 4px" data-t="slotP"></p>
      <div class="row" id="slotBtns"></div>
      <div class="res" id="slotRes"></div>
      <div class="res" id="tryRes"></div>
    </div>
    <div class="row" style="margin-top:10px"><button class="btn" id="dl" data-t="dl" disabled></button><button class="btn" id="cp" data-t="cp" disabled></button></div>
  </div>
</main>
<footer><span data-t="foot"></span> · <span id="fv"></span></footer>

<div id="mm">
  <div id="mmTop"><div id="mmBot"><button class="btn pri" id="mmGo"></button><button class="btn" id="mmX" aria-label="close">✕</button></div>
    <div id="mmPhase"></div><div id="mmMsg"></div><div id="mmVals"></div><div id="mmBar"><b></b></div></div>
  <div id="mmStage"><div id="mmWrap"><video id="vid" playsinline muted></video><canvas id="ov"></canvas><div id="mmCount"></div><div id="mmAlert"></div><div id="mmPlace"></div></div></div>
</div>
<canvas id="cv" style="display:none"></canvas>

async function autoPlace(){

  try{await unlock();await tc({r:0,g:0,b:0});}catch(e){data.place={ok:false,why:'no test_colour'};return t('plManual');}
  const res={ok:false};
  try{
    mm(undefined,t('plRun')+' 1/4');await castImage('black.png');await wait(3500);const F0=await grabLum(5);
    mm(undefined,t('plRun')+' 2/4');await tc({r:64,g:64,b:64});await wait(1500);const FS=await grabLum(5);
    mm(undefined,t('plRun')+' 3/4');await tc({r:0,g:0,b:0});await castImage('centre_white.png');await wait(4000);const FC=await grabLum(5);
    mm(undefined,t('plRun')+' 4/4');await castImage('frame_white.png');await wait(4000);const FA=await grabLum(5);
    const {W,H}=F0,dif=(F)=>F.a.map((v,i)=>Math.max(0,v-F0.a[i]));const dS=dif(FS),dC=dif(FC),dA=dif(FA);

    // v0.10: the screen = bright with the white centre OR very bright with the white frame (the screen's own border is
    // far brighter than its glow on the wall); no more «widen the centre by its frames» (v0.9: the box grew over the
    // strip's glow). Rows / columns with at least 20 % screen pixels, the longest run of them.
    const p99=A=>{const q=Float32Array.from(A).sort();return q[Math.floor(q.length*0.99)];},pc=p99(dC),pa=p99(dA);

    const [sy0,sy1]=run(H,y=>{let c=0;for(let x=0;x<W;x++)c+=scr[y*W+x];return c/W;});
    if(sy1<sy0){res.why='screen not found';data.place=res;return t('plNoScreen');}
    const [sx0,sx1]=run(W,x=>{let c=0;for(let y=sy0;y<=sy1;y++)c+=scr[y*W+x];return c/(sy1-sy0+1);});
    placeRect={x:sx0/W,y:sy0/H,w:(sx1-sx0+1)/W,h:(sy1-sy0+1)/H};
    res.screen={x0:+(sx0/W).toFixed(3),y0:+(sy0/H).toFixed(3),x1:+(sx1/W).toFixed(3),y1:+(sy1/H).toFixed(3)};
    const cx0=Math.round(sx0+(sx1-sx0)*0.25),cx1=Math.round(sx0+(sx1-sx0)*0.75);
    const row=(D,y)=>{let s=0;for(let x=cx0;x<=cx1;x++)s+=D[y*W+x];return s/(cx1-cx0+1);};

    const half=(D,from,step,stop)=>{let pk=0,py=-1;for(let y=from;y!==stop;y+=step){const v=row(D,y);if(v>pk){pk=v;py=y;}}

  const g=n=>{const a=data.A.find(x=>x.name===n);return a&&a.B&&linz(a.B.m,cc);},off=g('off');if(!off)return null;
  // the strip on the wall, per unit PWM (columns = strip R / G / B), from the 96 step of the ramp
  const col=c=>{const v=g('rgb'[c]+'96');return v&&v.map((x,k)=>Math.max(0,x-off[k])/(96/255));},Acols=[col(0),col(1),col(2)];if(Acols.some(c=>!c))return null;
  const A=[0,1,2].map(r=>[Acols[0][r],Acols[1][r],Acols[2][r]]);
  const Yl=m=>0.2126*m[0]+0.7152*m[1]+0.0722*m[2],rows=[];
  data.C.forEach((c,i)=>{const b=data.B[i];if(!b||!b.S||!c.B||!b.B)return;
    const L=(b.esp||[]).flatMap(e=>(e.lamps||[]).filter(l=>l.xy)).slice(-6);if(!L.length)return;
    const x=L.reduce((a,l)=>a+l.xy[0],0)/L.length,y=L.reduce((a,l)=>a+l.xy[1],0)/L.length,bri=L.reduce((a,l)=>a+l.bri8,0)/L.length;
    const S=linz(b.S.m,cc),Bn=linz(c.B.m,cc).map((v,k)=>Math.max(0,v-linz(b.B.m,cc)[k]));rows.push({name:c.name,rl:xyLin(x,y,bri),S,Bn});});
  const w=rows.find(r=>r.name==='white');if(!w||rows.length<4)return null;
  const k=Yl(w.Bn)/(Yl(w.S)||1);  // the white stays as bright as now: only the colours move
  const bgt=Math.max(0.05,saved.brightness);
  rows.forEach(r=>{const p=solve3(A,r.S.map(v=>k*v));r.target=p?p.map(v=>Math.max(0,v)/bgt):null;});
  // least squares per output row, pulled gently toward the white balance in force now (ridge)
  const cmNow=savedFull&&savedFull.cm_on&&savedFull.cm,m0=cmNow?[cmNow.slice(0,3),cmNow.slice(3,6),cmNow.slice(6,9)]:[[saved.wb_r,0,0],[0,saved.wb_g,0],[0,0,saved.wb_b]],ok=rows.filter(r=>r.target),cm=[];
  let tr=0;ok.forEach(r=>tr+=r.rl.reduce((a,v)=>a+v*v,0));const lam=0.05*tr/3;
  for(let o=0;o<3;o++){const N=[[lam,0,0],[0,lam,0],[0,0,lam]],v=[lam*m0[o][0],lam*m0[o][1],lam*m0[o][2]];
    ok.forEach(r=>{const wt=r.name==='white'?4:1;for(let a=0;a<3;a++){v[a]+=wt*r.rl[a]*r.target[o];for(let c=0;c<3;c++)N[a][c]+=wt*r.rl[a]*r.rl[c];}});
    const m=solve3(N,v);if(!m)return null;cm.push(...m.map(x=>Math.max(-2,Math.min(2,+x.toFixed(4)))));}
  // what the camera should see with it (the same model), for the table
  const pred=ok.map(r=>{let o=[0,1,2].map(i=>Math.max(0,cm[3*i]*r.rl[0]+cm[3*i+1]*r.rl[1]+cm[3*i+2]*r.rl[2]));const mx=Math.max(...o);if(mx>1)o=o.map(v=>v/mx);
    const B=[0,1,2].map(i=>A[i][0]*o[0]*bgt+A[i][1]*o[1]*bgt+A[i][2]*o[2]*bgt);const d=(p,q)=>{const a=chroma(p),b=chroma(q);return 100*Math.hypot(a[0]-b[0],a[1]-b[1]);};
    return {name:r.name,now:+d(r.S,r.Bn).toFixed(1),after:+d(r.S,B).toFixed(1)};});
  // v0.13: the white's total drive as it is now (the brightness the user tuned), not the camera's level at the bands
  // (v0.12 run: the fit halved it - the bands are different spots of the wall)
  const wrl=w.rl,nowSum=[0,1,2].reduce((a,o)=>a+Math.max(0,m0[o][0]*wrl[0]+m0[o][1]*wrl[1]+m0[o][2]*wrl[2]),0);
  return {cm,k:+k.toFixed(3),pred,wrl:wrl.map(v=>+v.toFixed(4)),now_sum:+nowSum.toFixed(4)};}
let tryOn=false,tryFit=null,trim={x:0,y:0,b:1};
// v0.16 (user: «να μπορώ αφού συνδεθώ να πειράξω τους δείκτες χρώματος χωρίς να κάνω όλο το τεστ»): the sliders on top
// of what is in force now - the loaded correction (cm_on) or the white balance as a diagonal matrix (exact with
// keep_pure off); a white of [1,1,1], so all sliders at 0 / 100 % = the very same strip as now
function baseFit(){if(!savedFull)return null;
  const cm=savedFull.cm_on&&savedFull.cm?savedFull.cm.slice():[savedFull.wb_r,0,0,0,savedFull.wb_g,0,0,0,savedFull.wb_b];
  const now=[0,1,2].reduce((a,o)=>a+Math.max(0,cm[3*o]+cm[3*o+1]+cm[3*o+2]),0);
  return {cm,wrl:[1,1,1],now_sum:+now.toFixed(4),base:true,from:savedFull.cm_on&&savedFull.cm?'cm':'wb',pred:[]};}
// v0.13: the last white / brightness trim is remembered on this phone (v0.12 run: warmer -0.55 was needed)
try{const st=JSON.parse(localStorage.getItem('ambiTrim')||'null');if(st&&isFinite(st.x)&&isFinite(st.y))trim={x:+st.x,y:+st.y,b:isFinite(st.b)?+st.b:1};}catch(e){}
// v0.12 (user: «έδειχνε τα χρώματα πάρα πολύ καλά, μόνο το λευκό δεν έδειχνε σωστά»): the white by eye on top of the
// fitted matrix - its output rows are scaled (warm <-> cool, green <-> magenta, the ESP page's eye-slider formula),
// then everything is scaled so no row grows (the brightness never goes up)
// v0.13: then scaled so the white's total drive = now × the brightness slider (100 % = as now)
function trimmed(){const K=Math.LN2,w=[Math.exp(-K*trim.x/2+K*trim.y/4),Math.exp(-K*trim.y/2),Math.exp(K*trim.x/2+K*trim.y/4)];
  const m=tryFit.cm.map((v,i)=>v*w[Math.floor(i/3)]),wr=tryFit.wrl,out=[0,1,2].map(o=>m[3*o]*wr[0]+m[3*o+1]*wr[1]+m[3*o+2]*wr[2]);
  const sum=out.reduce((a,v)=>a+Math.max(0,v),0),f=sum>1e-6?tryFit.now_sum*(trim.b||1)/sum:1;
  const r=m.map(v=>+Math.max(-2,Math.min(2,v*f)).toFixed(4));data.try_sent=r;return r;}
// one request at a time, the last slider position wins (150 ms after the finger stops)
let trimTm=null,trimBusy=false,trimAgain=false;
async function trimSend(){if(trimBusy){trimAgain=true;return;}trimBusy=true;try{if(!tryOn)await setTry(true);else await setTry(true);}finally{trimBusy=false;if(trimAgain){trimAgain=false;trimSend();}}}
function trimShow(){$('trimVal').textContent=t('trimNow').replace('%x',trim.x.toFixed(2)).replace('%y',trim.y.toFixed(2)).replace('%b',Math.round(trim.b*100));}
function trimMoved(){trim={x:+$('trX').value/100,y:+$('trY').value/100,b:+$('trB').value/100};data.try_trim={...trim};
  if(tryFit&&!tryFit.base)try{localStorage.setItem('ambiTrim',JSON.stringify(trim));}catch(e){}
  trimShow();clearTimeout(trimTm);trimTm=setTimeout(trimSend,150);}
function trimZero(){$('trX').value=0;$('trY').value=0;$('trB').value=100;trimMoved();}
function trimNudge(id,d){const e=$(id);e.value=Math.max(+e.min,Math.min(+e.max,+e.value+d));trimMoved();}
function trimInit(){$('trX').value=Math.round(trim.x*100);$('trY').value=Math.round(trim.y*100);$('trB').value=Math.round(trim.b*100);data.try_trim={...trim};trimShow();}
async function setTry(on){const out=$('tryRes');
  try{await unlock();
    if(on){await ambiPost('/settings/strip',{preview:true,cm_on:true,cm:trimmed()});tryOn=true;}
    else{await ambiPost('/settings/strip',{...saved});tryOn=false;}
    $('tryOn').disabled=tryOn;$('tryOff').disabled=!tryOn;out.className='res '+(tryOn?'warn':'ok');out.textContent=tryOn?t('tryIsOn'):t('tryIsOff');
  }catch(e){out.className='res bad';out.textContent='✗ '+e;}}
$('tryOn').onclick=()=>setTry(true);$('tryOff').onclick=()=>setTry(false);
['trX','trY','trB'].forEach(id=>$(id).addEventListener('input',trimMoved));$('trZero').onclick=trimZero;
document.querySelectorAll('[data-nudge]').forEach(b=>{const [id,d]=b.dataset.nudge.split(',');b.onclick=()=>trimNudge(id,+d);});
$('tryFade').onclick=()=>{if(sess())castVideo('fades.mp4').catch(()=>{});};
// v0.14 (user: «θέλω 3 σλοτ»): the ESP's three memory slots (firmware v0.53+ keeps the colour matrix in them);
// the page stores the correction as it is on the strip now (fit + white sliders); loading is on the ESP page
let slotsNow=null;
async function slotsLoad(){try{slotsNow=await espGet('/ambi/api/settings/wb_slots');}catch(e){slotsNow=null;}slotsShow();}
function slotsShow(){const box=$('slotBtns');if(!box)return;box.innerHTML='';if(!slotsNow||!slotsNow.slots)return;
  const v053=slotsNow.slots.every(x=>x.empty||'cm_on' in x);
  slotsNow.slots.forEach(x=>{const b=document.createElement('button');b.className='btn';b.style.padding='8px 10px';
    b.textContent=x.n+' · '+(x.empty?t('slotEmpty'):x.name)+(x.cm_on?' ✦':'');b.disabled=!v053;b.onclick=()=>slotSave(x);box.appendChild(b);});
  if(!v053){$('slotRes').className='res warn';$('slotRes').textContent=t('slotOld');}}
async function slotSave(x){if(!tryFit||!savedFull)return;
  if(!x.empty&&!confirm(t('slotAsk').replace('%n',x.n).replace('%s',x.name)))return;
  const nm=prompt(t('slotName'),x.empty?t('slotDef'):x.name);if(nm===null)return;
  try{await unlock();
    const j=await ambiPost('/settings/wb_slots',{slot:x.n,action:'save',name:(nm.trim()||t('slotDef')).slice(0,24),
      values:{wb_r:savedFull.wb_r,wb_g:savedFull.wb_g,wb_b:savedFull.wb_b,wb_keep_pure:savedFull.wb_keep_pure,cm_on:true,cm:trimmed()}});
    slotsNow=j;slotsShow();data.slot_saved={n:x.n,cm:data.try_sent};
    $('slotRes').className='res ok';$('slotRes').textContent=t('slotOk').replace('%n',x.n);}
  catch(e){$('slotRes').className='res bad';$('slotRes').textContent='✗ '+e;}}
const tryHome=$('tryBox').parentNode,tryNext=$('tryBox').nextElementSibling;
function tryTexts(){if(!tryFit)return;const b=!!tryFit.base;$('tryPtxt').textContent=t(b?'tryP0':'tryP');$('trimPtxt').textContent=t(b?'trimP0':'trimP');$('tryOn').textContent=t(b?'tryOn0':'tryOn');$('trZero').textContent=t(b?'trZero0':'trZero');
  if(!tryOn){$('tryRes').className='res mut';$('tryRes').textContent=b?t('tryBase')+(tryFit.from==='cm'?t('tryBaseCm'):t('tryBaseWb')+savedFull.wb_r+' / '+savedFull.wb_g+' / '+savedFull.wb_b)
    :t('tryPred')+' '+tryFit.pred.map(p=>p.name+' '+p.now+' → '+p.after).join(' · ');}}
function showTry(mode){const box=$('tryBox');
  if(mode==='now'){tryFit=baseFit();trim={x:0,y:0,b:1};$('eyeSlot').appendChild(box);$('eyeCard').style.display=tryFit?'block':'none';}
  else{tryFit=fitCm();try{const st=JSON.parse(localStorage.getItem('ambiTrim')||'null');if(st&&isFinite(st.x)&&isFinite(st.y))trim={x:+st.x,y:+st.y,b:isFinite(st.b)?+st.b:1};}catch(e){}
    if(tryFit){tryHome.insertBefore(box,tryNext);$('eyeCard').style.display='none';}
    else if(savedFull)return showTry('now');}  // no fit from this run: the sliders stay on what plays now
  data.try_fit=tryFit;if(!tryFit){box.style.display='none';return;}box.style.display='block';trimInit();slotsLoad();
  const tp=$('tryPats');tp.innerHTML='';COLS.forEach(([n,c])=>{const b=document.createElement('button');b.className='btn';b.style.padding='8px 10px';
    b.innerHTML='<span class="sw" style="background:'+c+'"></span>'+n;b.onclick=()=>{if(sess())castImage((n==='grey50'?'grey128':n)+'.png').catch(()=>{});else{$('tryRes').className='res warn';$('tryRes').textContent=t('need');}};tp.appendChild(b);});
  tryTexts();}
function summary(){
  const nRe=['A','B','C'].reduce((a,k)=>a+data[k].filter(r=>r.tries).length,0),nBad=['B','C'].reduce((a,k)=>a+data[k].filter(r=>r.unsteady).length,0);
  const cc=camCurve();data.cam=cc?{curve:cc.curve}:null;
  if(cc){const g=n=>{const a=data.A.find(x=>x.name===n);return a&&a.B&&linz(a.B.m,cc);},w=g('w48'),r=g('r48'),gg=g('g48'),b=g('b48');
    if(w&&r&&gg&&b)data.cam.additivity=[0,1,2].map(c=>+(w[c]/((r[c]+gg[c]+b[c])||1)).toFixed(2));}
  // v0.8: the TV glow is taken from phase B (strip dark: no strip light / lens flare in it), the bottom from phase C
  // minus phase B's bottom (the TV's own light that reaches the bottom band)
  const Y=m=>0.2126*m[0]+0.7152*m[1]+0.0722*m[2];
  const pair=(i,kS,kB)=>{const b=data.B[i],c=data.C[i];if(!b||!c||!b[kS]||!c[kB]||!b[kB])return null;
    const S=linz(b[kS].m,cc),Bc=linz(c[kB].m,cc),Bl=linz(b[kB].m,cc);if(!S||!Bc||!Bl)return null;
    return {S,B:Bc.map((v,k)=>Math.max(0,v-Bl[k]))};};
  const dd=q=>{if(!q)return null;const a=chroma(q.S),b=chroma(q.B);return Math.hypot(a[0]-b[0],a[1]-b[1])*100;};
  const cls=d=>d===null?'':d<2?'ok':d<5?'warn':'bad',fmt=d=>d===null?'–':d.toFixed(1),gaps=[];data.compare=[];
  let h='<p class="mut" style="margin:10px 0 0">'+t('sumT')+'</p><table><tr><th>'+t('col')+'</th><th>'+t('diff')+'</th><th>'+t('diff2')+'</th><th>'+t('bri')+'</th></tr>';
  data.C.forEach((r,i)=>{const n=pair(i,'S','B'),f=pair(i,'S2','B2');if(!n)return;const d=dd(n),d2=dd(f);if(d2!==null)gaps.push(Math.abs(d-d2));
    const bri=Y(n.S)>0?Y(n.B)/Y(n.S):null;data.compare.push({name:r.name,d:d&&+d.toFixed(2),d_far:d2&&+d2.toFixed(2),bri:bri&&+bri.toFixed(3)});
    h+='<tr><td><span class="sw" style="background:'+COLS[i][1]+'"></span>'+r.name+(r.holdout?' *':'')+(r.unsteady?' ⚠':'')+'</td><td class="'+cls(d)+'">'+fmt(d)+'</td><td class="'+cls(d2)+'">'+fmt(d2)+'</td><td>'+(bri!==null?Math.round(100*bri)+' %':'–')+'</td></tr>';});
  gaps.sort((a,b)=>a-b);const med=gaps.length?gaps[gaps.length>>1]:null;data.repeat_median=med;
  const verdict=med===null?'':med<2.5?'<p class="ok" style="margin:8px 0 0">'+t('okRep')+'</p>':'<p class="bad" style="margin:8px 0 0">'+t('badRep').replace('%s',med.toFixed(1))+'</p>';
  const camTxt=cc?'<p class="mut" style="margin:8px 0 0">'+t('camLine').replace('%g',cc.curve.map(c=>c.g.toFixed(2)).join(' / ')).replace('%a',data.cam.additivity?data.cam.additivity.join(' / '):'–')+'</p>':'<p class="warn" style="margin:8px 0 0">'+t('noCurve')+'</p>';
  $('sum').innerHTML=h+'</table>'+verdict+camTxt+'<p class="mut" style="margin:8px 0 0">'+t('retakes')+': '+nRe+' · '+t('unstable')+': '+nBad+'</p>';
  $('runRes').className='res ok';$('runRes').textContent=t('done').split('.')[0]+'.';showTry();}
$('dl').onclick=()=>{const b=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ambibottom-measure-'+(data.started||'').replace(/[:.]/g,'-')+'.json';a.click();};
