<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AmbiBottom Companion – browser check</title>
<link rel="icon" href="data:,">
<!-- Temporary test page for the companion: can THIS browser (1) talk to the ESP on the LAN from an
     https page, (2) cast test patterns to the TV, (3) lock the camera's exposure / white balance?
     Nothing leaves the browser: no server, no analytics; the ESP address is kept in this browser only. -->
<style>
:root{--bg:#0f1416;--panel:#172024;--panel2:#1e2a2f;--line:#2b3a40;--text:#e6eef0;--muted:#8fa3a8;--acc:#4dbda7;--acc2:#70d8cc;--warn:#e0b040;--bad:#e06a5a;--ok:#5ccf8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:16px;margin:0;letter-spacing:.06em}header h1 em{color:var(--acc);font-style:normal}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px}
.card h2{margin:0 0 4px;font-size:17px}.card p{margin:0 0 10px;color:var(--muted);font-size:14px}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#06221d}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text]{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit}
.res{margin-top:10px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}.mut{color:var(--muted)}
.pats{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px;margin-top:10px}
.pats button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:8px;font:inherit;font-size:13px;cursor:pointer}
.pats i{width:18px;height:18px;border-radius:5px;border:1px solid rgba(255,255,255,.2);flex:none}
video{width:100%;border-radius:10px;background:#000;margin-top:10px;display:none}
canvas{display:none}
table{border-collapse:collapse;font-size:12px;margin-top:8px;width:100%;table-layout:fixed}td{padding:3px 6px;border-top:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}td:first-child{width:34%}td:first-child{color:var(--muted);white-space:nowrap}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.lang button{border:0;background:none;color:var(--muted);padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}.lang button.on{background:var(--acc);color:#06221d}
google-cast-launcher{display:inline-block;width:40px;height:40px;cursor:pointer;--connected-color:var(--acc2);--disconnected-color:var(--text)}
footer{color:var(--muted);font-size:12px;text-align:center;padding:8px 16px 24px}
</style>
</head>
<body>
<header><h1>AMBI<em>BOTTOM</em> · <span data-t="title"></span></h1>
  <div class="lang"><button id="lEn">EN</button><button id="lEl">ΕΛ</button></div></header>
<main>
  <div class="card"><p data-t="intro"></p><div class="res mut" id="ua"></div></div>

  <div class="card">
    <h2>1 · <span data-t="espT"></span></h2>
    <p data-t="espP"></p>
    <div class="row"><input type="text" id="addr" autocomplete="off" spellcheck="false" inputmode="url"><button class="btn pri" id="espGo" data-t="test"></button></div>
    <div class="res" id="espRes"></div>
  </div>

  <div class="card">
    <h2>2 · <span data-t="castT"></span></h2>
    <p data-t="castP"></p>
    <div class="row"><google-cast-launcher id="castBtn" hidden></google-cast-launcher><span class="res" id="castRes" style="margin:0"></span></div>
    <div class="pats" id="pats"></div>
  </div>

  <div class="card">
    <h2>3 · <span data-t="camT"></span></h2>
    <p data-t="camP"></p>
    <div class="row"><button class="btn pri" id="camGo" data-t="camStart"></button><button class="btn" id="camLock" data-t="camLock" disabled></button></div>
    <div class="row" style="margin-top:8px"><button class="btn" id="autoGo" data-t="autoGo"></button></div>
    <div class="res" id="autoRes"></div>
    <video id="vid" playsinline muted></video><canvas id="cv"></canvas>
    <div class="res" id="camStab"></div>
    <table id="camCaps"></table>
    <div class="res" id="camRes"></div>
  </div>

  <div class="card">
    <h2 data-t="repT"></h2>
    <p data-t="repP"></p>
    <button class="btn" id="repCopy" data-t="repCopy"></button>
    <div class="res mut" id="repOut"></div>
  </div>
</main>
<footer data-t="foot"></footer>
<script>
const T={
 en:{title:'browser check',intro:'This page checks what THIS browser can do for the colour calibration: talk to your AmbiBottom, show test patterns on the TV, and lock the camera. Nothing is sent anywhere except to your ESP and your TV.',
  espT:'Talk to the ESP',espP:'Type the ESP\'s address (IP, e.g. 192.0.2.20). Chrome may ask to allow access to devices on your local network: allow it. Read only, nothing is changed.',test:'Test',
  castT:'Test patterns on the TV (Cast)',castP:'Press the Cast icon, pick the TV, then a colour. The TV downloads the picture from this site.',
  camT:'Camera',camP:'Lock test: aim the middle of the picture at the side glow on the wall, with the TV screen in the picture. Press «Lock», then cast «White» and «White frame, black centre» a few times. The Ambilight stays the same (it reads the edges), only the screen gets darker or brighter. Locked = the spread stays a few %; not locked = the numbers jump.',camStart:'Start camera',camLock:'Lock exposure + white balance',
  autoGo:'Automatic lock test (~90 s)',autoNeed:'First connect Cast to the TV and start the camera; keep the phone still, the middle of the picture on the side glow.',autoRun:'Running',autoA:'Automatic camera',autoL:'Locked camera',autoCh:'white -> frame:',autoRep:'white repeat',autoDone:'Done. Copy the report below.',
  repT:'Report',repP:'Copy the results and paste them in the chat.',repCopy:'Copy report',foot:'AmbiBottom companion · test page · no data leaves your browser',
  ok:'OK',fail:'Failed',notChrome:'Cast needs Chrome (desktop or Android).',castNo:'Cast not available in this browser.',castReady:'Cast ready: press the icon.',castOn:'Connected to ',castNoSess:'Press the Cast icon first.',sent:'Sent: ',
  mixed:'The browser blocked the request (mixed content / local network access). This browser needs the fallback (open the ESP page in a second window).',
  perm:'Local-network permission: ',noCam:'No camera access: ',stab:'Centre box, linear RGB, last 3 s',spread:'spread',locked:'Lock asked. Settings now:',noLock:'This camera does not offer manual exposure / white balance here.',copied:'Copied.'},
 el:{title:'έλεγχος browser',intro:'Η σελίδα ελέγχει τι μπορεί ΑΥΤΟΣ ο browser για τη βαθμονόμηση χρώματος: να μιλήσει με το AmbiBottom, να δείξει μοτίβα στην TV, να κλειδώσει την κάμερα. Τίποτα δεν στέλνεται πουθενά, εκτός από το ESP και την TV σου.',
  espT:'Σύνδεση με το ESP',espP:'Γράψε τη διεύθυνση του ESP (IP, π.χ. 192.0.2.20). Το Chrome μπορεί να ρωτήσει αν επιτρέπεις πρόσβαση σε συσκευές του τοπικού δικτύου: πάτα να επιτρέπεται. Μόνο ανάγνωση, δεν αλλάζει τίποτα.',test:'Δοκιμή',
  castT:'Μοτίβα στην TV (Cast)',castP:'Πάτα το εικονίδιο Cast, διάλεξε την TV, μετά ένα χρώμα. Η TV κατεβάζει την εικόνα από αυτό το site.',
  camT:'Κάμερα',camP:'Δοκιμή κλειδώματος: στρέψε τη μέση του κάδρου στη λάμψη του πλαγίου στον τοίχο, να φαίνεται και η οθόνη της TV. Πάτα «Κλείδωμα» και μετά κάνε cast «Λευκό» και «Λευκό πλαίσιο, μαύρη μέση» μερικές φορές. Το Ambilight μένει ίδιο (διαβάζει τις άκρες), αλλάζει μόνο πόσο φωτίζει η οθόνη. Κλειδωμένο = η διακύμανση μένει λίγα %· ξεκλείδωτο = τα νούμερα πηδάνε.',camStart:'Άνοιγμα κάμερας',camLock:'Κλείδωμα έκθεσης + white balance',
  autoGo:'Αυτόματη δοκιμή κλειδώματος (~90 s)',autoNeed:'Πρώτα σύνδεσε το Cast με την TV και άνοιξε την κάμερα· κινητό ακίνητο, η μέση του κάδρου στη λάμψη του πλαγίου.',autoRun:'Τρέχει',autoA:'Κάμερα σε αυτόματο',autoL:'Κάμερα κλειδωμένη',autoCh:'λευκό -> πλαίσιο:',autoRep:'επανάληψη λευκού',autoDone:'Τέλος. Αντίγραψε την αναφορά παρακάτω.',
  repT:'Αναφορά',repP:'Αντίγραψε τα αποτελέσματα και επικόλλησέ τα στη συζήτηση.',repCopy:'Αντιγραφή αναφοράς',foot:'AmbiBottom companion · δοκιμαστική σελίδα · κανένα δεδομένο δεν φεύγει από τον browser',
  ok:'OK',fail:'Απέτυχε',notChrome:'Το Cast θέλει Chrome (υπολογιστή ή Android).',castNo:'Το Cast δεν υπάρχει σε αυτόν τον browser.',castReady:'Το Cast είναι έτοιμο: πάτα το εικονίδιο.',castOn:'Συνδέθηκε με ',castNoSess:'Πάτα πρώτα το εικονίδιο Cast.',sent:'Στάλθηκε: ',
  mixed:'Ο browser μπλόκαρε το αίτημα (mixed content / πρόσβαση στο τοπικό δίκτυο). Αυτός ο browser θα χρειαστεί την εναλλακτική λύση (σελίδα του ESP σε δεύτερο παράθυρο).',
  perm:'Άδεια τοπικού δικτύου: ',noCam:'Χωρίς πρόσβαση στην κάμερα: ',stab:'Κεντρικό κουτί, γραμμικό RGB, τελευταία 3 s',spread:'διακύμανση',locked:'Ζητήθηκε κλείδωμα. Ρυθμίσεις τώρα:',noLock:'Αυτή η κάμερα δεν δίνει εδώ χειροκίνητη έκθεση / white balance.',copied:'Αντιγράφηκε.'}};
const PATS=[['white','#fff','White','Λευκό'],['frame_white','#000;box-shadow:inset 0 0 0 4px #fff','White frame, black centre','Λευκό πλαίσιο, μαύρη μέση'],['grey192','#c0c0c0','Grey 75%','Γκρι 75%'],['grey128','#808080','Grey 50%','Γκρι 50%'],['grey64','#404040','Grey 25%','Γκρι 25%'],['black','#000','Black','Μαύρο'],
 ['red','#f00','Red','Κόκκινο'],['green','#0f0','Green','Πράσινο'],['blue','#00f','Blue','Μπλε'],['yellow','#ff0','Yellow','Κίτρινο'],['cyan','#0ff','Cyan','Κυανό'],['magenta','#f0f','Magenta','Ματζέντα'],
 ['orange','#ff8000','Orange','Πορτοκαλί'],['skin','#e9b48f','Skin','Δέρμα'],['purple','#8a4fd0','Purple','Μωβ']];
const $=id=>document.getElementById(id);
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let L=store.get('ab_lang')||((navigator.language||'').toLowerCase().startsWith('el')?'el':'en');
const t=k=>T[L][k]||k;
const report={page:'spike-1',ua:navigator.userAgent,esp:null,cast:null,camera:null};
function lang(l){L=l;store.set('ab_lang',l);document.documentElement.lang=l;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  $('lEn').className=l==='en'?'on':'';$('lEl').className=l==='el'?'on':'';
  $('addr').placeholder=l==='el'?'IP του ESP':'ESP IP address';drawPats();}
$('lEn').onclick=()=>lang('en');$('lEl').onclick=()=>lang('el');
$('ua').textContent=navigator.userAgent+(window.isSecureContext?' · secure context':' · NOT a secure context');

// ---- 1. ESP (read only)
$('addr').value=store.get('ab_addr')||'';
$('addr').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('espGo').click();}});
async function permState(){for(const n of ['local-network-access','local-network']){try{const p=await navigator.permissions.query({name:n});return n+'='+p.state;}catch(e){}}return 'n/a';}
$('espGo').onclick=async()=>{
  const a=$('addr').value.trim().replace(/^https?:\/\//,'').replace(/\/.*$/,'');if(!a)return;store.set('ab_addr',a);
  const out=$('espRes');out.className='res mut';out.textContent='…';
  const r={perm_before:await permState()};const t0=performance.now();
  try{
    const res=await fetch('http://'+a+'/ambi/api/state',{cache:'no-store',targetAddressSpace:'local'});
    r.http=res.status;const d=await res.json();r.ms=Math.round(performance.now()-t0);
    r.version=d.bridge_version;r.service=d.service;r.leds=d.output&&d.output.leds?d.output.leds.length:null;
    r.perm_after=await permState();
    out.className='res ok';out.textContent=t('ok')+' · '+r.version+' · '+r.ms+' ms · '+t('perm')+r.perm_after;
  }catch(e){r.error=String(e);r.perm_after=await permState();out.className='res bad';out.textContent=t('fail')+': '+e+'\n'+t('mixed')+'\n'+t('perm')+r.perm_after;}
  report.esp=r;};

// ---- 2. Cast
let castOk=false;
function drawPats(){const p=$('pats');p.innerHTML='';PATS.forEach(([f,c,en,el])=>{const b=document.createElement('button');b.innerHTML='<i style="background:'+c+'"></i>'+(L==='el'?el:en);b.onclick=()=>castPat(f);p.appendChild(b);});}
function castPat(f){
  if(!castOk){$('castRes').textContent=t('castNo');return Promise.reject(new Error('no cast'));}
  const s=cast.framework.CastContext.getInstance().getCurrentSession();if(!s){$('castRes').textContent=t('castNoSess');return Promise.reject(new Error('no session'));}
  const url=new URL('patterns/'+f+'.png',location.href).href;
  const mi=new chrome.cast.media.MediaInfo(url,'image/png');mi.metadata=new chrome.cast.media.PhotoMediaMetadata();mi.metadata.title='AmbiBottom '+f;
  if(report.camera&&report.camera.last){(report.camera.per_cast=report.camera.per_cast||[]).push({next_cast:f,locked:!!report.camera.lock&&!report.camera.lock.error,rgb:report.camera.last.rgb,spread_pct:report.camera.last.spread_pct});}
  return s.loadMedia(new chrome.cast.media.LoadRequest(mi)).then(()=>{hist=[];$('castRes').textContent=t('sent')+f;(report.cast=report.cast||{}).sent=(report.cast.sent||0)+1;},
    e=>{$('castRes').textContent=t('fail')+': '+e;(report.cast=report.cast||{}).error=String(e);throw e;});}
window.__onGCastApiAvailable=ok=>{
  report.cast={api:ok};
  if(!ok){$('castRes').textContent=t('castNo');return;}
  castOk=true;const c=cast.framework.CastContext.getInstance();
  c.setOptions({receiverApplicationId:chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,autoJoinPolicy:chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED});
  $('castBtn').hidden=false;$('castRes').textContent=t('castReady');
  c.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED,()=>{const s=c.getCurrentSession();
    if(s){const n=s.getCastDevice().friendlyName;$('castRes').textContent=t('castOn')+n;report.cast.session=true;}});};
setTimeout(()=>{if(!report.cast){report.cast={api:false,loaded:false};$('castRes').textContent=/Chrome|CriOS|Edg/.test(navigator.userAgent)?t('castNo'):t('notChrome');}},8000);
const cs=document.createElement('script');cs.src='https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1';cs.async=true;document.head.appendChild(cs);

// ---- 3. Camera
let track=null,hist=[];
const KEYS=['exposureMode','exposureTime','exposureCompensation','iso','whiteBalanceMode','colorTemperature','focusMode','zoom','torch'];
const lin=v=>{v/=255;return v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4);};
function showCaps(){const c=track.getCapabilities?track.getCapabilities():{},s=track.getSettings();const tb=$('camCaps');tb.innerHTML='';
  const cap={};KEYS.forEach(k=>{if(c[k]===undefined&&s[k]===undefined)return;cap[k]={can:c[k],now:s[k]};
    const tr=document.createElement('tr');tr.innerHTML='<td>'+k+'</td><td>'+JSON.stringify(c[k]===undefined?'–':c[k])+'</td><td>'+JSON.stringify(s[k]===undefined?'–':s[k])+'</td>';tb.appendChild(tr);});
  return cap;}
$('camGo').onclick=async()=>{
  try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false});
    track=st.getVideoTracks()[0];const v=$('vid');v.srcObject=st;v.style.display='block';await v.play();
    report.camera={label:track.label,caps:showCaps()};$('camLock').disabled=false;sample();
  }catch(e){$('camRes').className='res bad';$('camRes').textContent=t('noCam')+e;report.camera={error:String(e)};}};
async function doLock(){
  const c=track.getCapabilities?track.getCapabilities():{},s=track.getSettings(),adv={};
  if(c.exposureMode&&c.exposureMode.includes('manual')){adv.exposureMode='manual';if(s.exposureTime)adv.exposureTime=s.exposureTime;if(s.iso)adv.iso=s.iso;}
  if(c.whiteBalanceMode&&c.whiteBalanceMode.includes('manual')){adv.whiteBalanceMode='manual';const ct=c.colorTemperature||{};let k=s.colorTemperature>0?s.colorTemperature:5000;if(ct.min!==undefined)k=Math.max(ct.min,Math.min(ct.max,k));if(ct.step)k=Math.round(k/ct.step)*ct.step;adv.colorTemperature=k;}
  if(!Object.keys(adv).length){$('camRes').className='res warn';$('camRes').textContent=t('noLock');report.camera.lock='unsupported';return;}
  try{await track.applyConstraints({advanced:[adv]});hist=[];const after=track.getSettings();
    $('camRes').className='res ok';$('camRes').textContent=t('locked')+' '+JSON.stringify(Object.fromEntries(KEYS.filter(k=>after[k]!==undefined).map(k=>[k,after[k]])));
    report.camera.lock={asked:adv,after:Object.fromEntries(KEYS.filter(k=>after[k]!==undefined).map(k=>[k,after[k]]))};showCaps();
  }catch(e){$('camRes').className='res bad';$('camRes').textContent=t('fail')+': '+e;report.camera.lock={error:String(e)};}}
$('camLock').onclick=()=>doLock();
$('autoGo').onclick=()=>autoTest();
// automatic lock test: «White» <-> «White frame, black centre» 3 times, first with the camera on automatic, then locked.
// The Ambilight (edges) is the same in both pictures; only the screen light changes.
async function autoTest(){
  const out=$('autoRes'),btn=$('autoGo');
  if(!track||track.readyState!=='live'||!castOk||!cast.framework.CastContext.getInstance().getCurrentSession()){out.className='res warn';out.textContent=t('autoNeed');return;}
  btn.disabled=true;out.className='res mut';
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  const read=()=>{const h=hist.slice(-8);if(!h.length)return null;const m=[0,1,2].map(i=>h.reduce((a,x)=>a+x[i],0)/h.length),S=m[0]+m[1]+m[2]||1,st=track.getSettings();
    return {Y:+(0.2126*m[0]+0.7152*m[1]+0.0722*m[2]).toFixed(5),r:+(m[0]/S).toFixed(4),b:+(m[2]/S).toFixed(4),et:st.exposureTime,iso:st.iso,ct:st.colorTemperature,em:st.exposureMode};};
  const res={};let step=0;
  try{
    for(const phase of ['auto','locked']){
      if(phase==='auto'){try{await track.applyConstraints({advanced:[{exposureMode:'continuous',whiteBalanceMode:'continuous'}]});}catch(e){}report.camera.lock=null;}
      else{await doLock();}
      const rows=[];
      for(let i=0;i<3;i++)for(const f of ['white','frame_white']){
        step++;out.textContent=t('autoRun')+' '+step+'/12 · '+(phase==='auto'?t('autoA'):t('autoL'))+' · '+f;
        await castPat(f);await wait(7000);rows.push({f,...read()});}
      const ch=[0,1,2].map(i=>rows[2*i+1].Y/rows[2*i].Y-1),wY=[0,2,4].map(i=>rows[i].Y);
      res[phase]={rows,change_pct:+(100*ch.reduce((a,v)=>a+v,0)/3).toFixed(1),change_range_pct:+(100*(Math.max(...ch)-Math.min(...ch))).toFixed(1),
        white_repeat_pct:+(100*(Math.max(...wY)-Math.min(...wY))/(wY.reduce((a,v)=>a+v,0)/3)).toFixed(1)};}
    report.camera.autotest=res;out.className='res ok';
    out.textContent=t('autoA')+': '+t('autoCh')+' '+res.auto.change_pct+' % ('+t('autoRep')+' '+res.auto.white_repeat_pct+' %)\n'+
      t('autoL')+': '+t('autoCh')+' '+res.locked.change_pct+' % ('+t('autoRep')+' '+res.locked.white_repeat_pct+' %)\n'+t('autoDone');
  }catch(e){out.className='res bad';out.textContent=t('fail')+': '+e;report.camera.autotest={error:String(e),partial:res};}
  btn.disabled=false;}
function sample(){
  const v=$('vid'),cv=$('cv');if(!track||track.readyState!=='live')return;
  const w=160,h=Math.round(160*v.videoHeight/Math.max(1,v.videoWidth));cv.width=w;cv.height=h;const x=cv.getContext('2d',{willReadFrequently:true});
  x.drawImage(v,0,0,w,h);const d=x.getImageData(Math.round(w*.4),Math.round(h*.4),Math.round(w*.2),Math.round(h*.2)).data;
  let r=0,g=0,b=0,n=0,clip=0;for(let i=0;i<d.length;i+=4){if(d[i]>=250||d[i+1]>=250||d[i+2]>=250){clip++;continue;}r+=lin(d[i]);g+=lin(d[i+1]);b+=lin(d[i+2]);n++;}
  if(n){hist.push([r/n,g/n,b/n]);if(hist.length>12)hist.shift();
    const m=[0,1,2].map(i=>hist.reduce((a,s)=>a+s[i],0)/hist.length),sp=[0,1,2].map(i=>{const vs=hist.map(s=>s[i]);return m[i]>0?(Math.max(...vs)-Math.min(...vs))/m[i]*100:0;});
    const sum=m[0]+m[1]+m[2]||1;
    $('camStab').textContent=t('stab')+': R '+m[0].toFixed(3)+' G '+m[1].toFixed(3)+' B '+m[2].toFixed(3)+' · r '+(m[0]/sum).toFixed(3)+' g '+(m[1]/sum).toFixed(3)+' · '+t('spread')+' '+Math.max(...sp).toFixed(1)+' %'+(clip?' · clipped '+clip:'');
    report.camera.last={rgb:m.map(v=>+v.toFixed(4)),spread_pct:+Math.max(...sp).toFixed(2),clipped:clip};}
  setTimeout(sample,250);}

// ---- report
$('repCopy').onclick=async()=>{const s=JSON.stringify(report,null,1);$('repOut').textContent=s;try{await navigator.clipboard.writeText(s);$('repOut').textContent=t('copied')+'\n'+s;}catch(e){}};
lang(L);
</script>
