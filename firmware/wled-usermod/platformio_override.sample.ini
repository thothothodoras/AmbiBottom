; AmbiBottom build environment for WLED 0.15.x (written by install.sh; @REPO@ = this repository).
[platformio]
default_envs = esp32s3dev_8MB

[env:esp32s3dev_8MB]
;; M5Stack AtomS3 Lite: ESP32-S3FN8, 8 MB flash, NO PSRAM, USB-C (native USB CDC).
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
platform = ${esp32s3.platform}
platform_packages = ${esp32s3.platform_packages}
upload_speed = 921600
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags} ${esp32s3.build_flags} -D WLED_RELEASE_NAME=\"ESP32-S3_8MB_AmbiBottom\"
  -D CONFIG_LITTLEFS_FOR_IDF_3_2 -D WLED_WATCHDOG_TIMEOUT=0
  -D ARDUINO_USB_CDC_ON_BOOT=1 -D ARDUINO_USB_MODE=1
  ;; AmbiBottom: Espalexa answers the same /description.xml and /api, so it has to go
  -D WLED_DISABLE_ALEXA
  -D USERMOD_AMBIBOTTOM
  ;; AtomS3 Lite pins: strip data G5, button G41 (ours, not WLED's), status LED G35
  -D DATA_PINS=5 -D BTNPIN=-1
  -D AMBIBOTTOM_LINK_PIN=41 -D AMBIBOTTOM_STATUS_PIN=35
  -D PIXEL_COUNTS=43
  ;; WLED's own limiter (ABL) as the second net: the SAME number as the usermod's
  ;; default budget. That only works with the two flags after it (v0.33):
  ;;  - WLED takes MA_FOR_ESP (120 mA on an ESP32) off the limit "for the ESP";
  ;;    here the ESP has its own USB port, so 0 - otherwise 450 means 330 for the
  ;;    strip and WLED dims everything our limiter lets through;
  ;;  - WLED counts 55 mA per LED by default, the pipeline 45 (v0.34: measured on the reference strip; was 60 = spec).
  ;; These are defaults for a fresh config: a saved cfg.json keeps its own values
  ;; (check LED Preferences > Maximum current / LED current after an update).
  -D ABL_MILLIAMPS_DEFAULT=450
  -D MA_FOR_ESP=0
  -D LED_MILLIAMPS_DEFAULT=45
  ;; the highest budgetMa the usermod accepts (the pipeline's build-time ceiling)
  -D AMBI_MAX_BUDGET_MA=900
  -I @REPO@/firmware/wled-usermod/AmbiBottom
  -I @REPO@/firmware/wled-usermod/lib/AmbiBottomEsp/src
lib_deps = ${esp32s3.lib_deps}
  symlink://@REPO@/shared/ambi_core
  symlink://@REPO@/firmware/wled-usermod/lib/AmbiBottomEsp
board_build.partitions = ${esp32.large_partitions}
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_filters = esp32_exception_decoder
