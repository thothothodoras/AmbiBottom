; AmbiBottom build environment for WLED 16.0.x (written by install16.sh; @REPO@ = this repository).
; Nothing in WLED's own files is changed: this override is git-ignored by WLED, and the
; usermod plus its two libraries come from this repository through symlink:// entries.
[platformio]
default_envs = atoms3_ambibottom

[ambibottom_flags]
;; shared by both environments below (each adds its own WLED_RELEASE_NAME; the release
;; name is also the .bin file name in build_output/release, so the two must differ)
flags =
  -D WLED_WATCHDOG_TIMEOUT=10  ; v0.44: watchdog ON again (10 s; was 0 since the v0.36 show() hang, whose cause was the status-LED RMT conflict)
  ;; Espalexa answers the same /description.xml and /api as our fake Hue bridge: has to go.
  ;; HueSync makes WLED a CLIENT of a real Hue bridge: not needed.
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_HUESYNC
  ; v0.40 (user 2026-11-19: remove what we do not use; frees flash for our own code):
  ; infrared remote, MQTT, ESP-NOW remotes, Loxone, Adalight (serial), 2D matrices and the particle effects
  -D WLED_DISABLE_INFRARED
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_ESPNOW
  -D WLED_DISABLE_LOXONE
  -D WLED_DISABLE_ADALIGHT
  -D WLED_DISABLE_2D
  -D WLED_DISABLE_PARTICLESYSTEM1D
  -D WLED_DISABLE_PARTICLESYSTEM2D
  -D WLED_DISABLE_PIXELFORGE
  ;; v0.38: WLED 16's own RMT driver (NeoEsp32RmtHI) again. v0.37 had -D WLED_USE_SHARED_RMT
  ;; because every show() waited 10 s - but the cause was the usermod's status LED (Arduino's
  ;; neopixelWrite took RMT channel 0 from under WLED), now off by default. The plain driver
  ;; flickered random LEDs on the friend's board (2026-11-19: Wi-Fi interrupts vs RMT refills,
  ;; the reason WLED has the HI driver at all).
  -D PIXEL_COUNTS=43
  ;; WLED's limiter as the second net = the usermod's budget (the ESP has its own USB port: MA_FOR_ESP 0)
  -D ABL_MILLIAMPS_DEFAULT=450
  -D WLED_TIMEZONE=0  ; v0.45: UTC for a fresh install (public build; was 3 = EET); the page sets it, and a board
  ;;                     that already has a time zone in its cfg.json keeps it
  -D SERVERNAME='"AmbiBottom"'  ; v0.45: WLED's device name on a fresh install (an existing name is kept)
  -D MA_FOR_ESP=0
  -D LED_MILLIAMPS_DEFAULT=40
  -D AMBI_MAX_BUDGET_MA=900
  -I @REPO@/firmware/wled-usermod/AmbiBottom
  -I @REPO@/firmware/wled-usermod/lib/AmbiBottomEsp/src
  -I @REPO@/shared/ambi_core

[ambibottom_atoms3]
;; v0.48: what is AtomS3-only (the 4 MB ESP32 build below has its own)
flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  ;; AtomS3 Lite as wired on 2026-11-17: strip data on G38; button G41 is ours (link button), status LED G35
  -D DATA_PINS=38 -D BTNPIN=-1
  ;; v0.37: status LED OFF (-1). Arduino's neopixelWrite() takes an RMT channel from its own
  ;; table, not knowing WLED already drives the strip on channel 0: it took channel 0 and turned
  ;; it to G35, so the strip got no data (seen 2026-11-18; strip lit at once with -1).
  -D AMBIBOTTOM_LINK_PIN=41 -D AMBIBOTTOM_STATUS_PIN=-1

[env:atoms3_ambibottom]
;; M5Stack AtomS3 Lite: ESP32-S3FN8, 8 MB flash, NO PSRAM, native USB. Based on WLED 16's
;; esp32s3dev_8MB_none (the build install.wled.me gives as "Plain, 8MB"), without audioreactive.
extends = env:esp32s3dev_8MB_none
;; WLED 16's default platform (Tasmota 2024.06.00) is built with CONFIG_MBEDTLS_TLS_DISABLED:
;; no TLS / DTLS at all, so the Hue stream (DTLS-PSK) cannot be built on it. WLED 16 names the
;; Espressif platform as the alternative ("needs 300KB extra flash"): arduino-esp32 2.0.17 +
;; ESP-IDF 4.4.7, whose mbedTLS has DTLS and PSK (as the 0.15 build's 6.3.2 had).
platform = espressif32@ ~6.13.0
platform_packages =
;; "Name = spec": WLED 16 cannot guess a library name from a symlink:// path (load_usermods.py)
custom_usermods = AmbiBottom = symlink://@REPO@/firmware/wled-usermod/AmbiBottom
build_unflags = ${esp32s3.build_unflags} -DBOARD_HAS_PSRAM
build_flags = ${common.build_flags} ${esp32s3.build_flags} -D WLED_RELEASE_NAME=\"ESP32-S3_8MB_AmbiBottom\"
  ${ambibottom_flags.flags} ${ambibottom_atoms3.flags}
lib_deps = ${esp32s3.lib_deps}
  symlink://@REPO@/shared/ambi_core
  symlink://@REPO@/firmware/wled-usermod/lib/AmbiBottomEsp

[env:atoms3_baseline]
;; the same build WITHOUT AmbiBottom (same platform and flags), only to measure what the usermod adds
extends = env:atoms3_ambibottom
custom_usermods =
build_flags = ${common.build_flags} ${esp32s3.build_flags} -D WLED_RELEASE_NAME=\"ESP32-S3_8MB_baseline\"
  ${ambibottom_flags.flags} ${ambibottom_atoms3.flags}
lib_deps = ${esp32s3.lib_deps}

[env:esp32_4mb_ambibottom]
;; v0.48: classic ESP32 with 4 MB flash (many ready-made WLED controllers, e.g. USB-C ones with
;; data on GPIO16 / GPIO2). English page only (no Greek copy: -66 KB) and WLED's "big" 4 MB layout
;; (1.8 MB per firmware slot, 256 KB for WLED's files) so an update still fits. Untested on hardware.
extends = env:esp32dev
platform = espressif32@ ~6.13.0
platform_packages =
custom_usermods = AmbiBottom = symlink://@REPO@/firmware/wled-usermod/AmbiBottom
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags} ${esp32_idf_V4.build_flags} -D WLED_RELEASE_NAME=\"ESP32_4MB_AmbiBottom\"
  -D ARDUINO_USB_CDC_ON_BOOT=0
  ${ambibottom_flags.flags}
  -D DATA_PINS=16 -D AMBIBOTTOM_LINK_PIN=-1 -D AMBIBOTTOM_STATUS_PIN=-1 -D AMBIBOTTOM_PAGE_EL=0
  -D AMBIBOTTOM_DATA_PINS=2,4,5,12,13,14,15,16,17,18,19,21,22,23,25,26,27,32,33
lib_deps = ${esp32_idf_V4.lib_deps}
  symlink://@REPO@/shared/ambi_core
  symlink://@REPO@/firmware/wled-usermod/lib/AmbiBottomEsp
board_build.partitions = tools/WLED_ESP32_4MB_256KB_FS.csv

